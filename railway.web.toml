# Servicio «web» de Railway (Next.js). Raíz del servicio: /web.
# En Settings del servicio → «Config as code», ruta del archivo: /railway.web.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/login"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Servicio «api» de Railway (FastAPI). En Settings del servicio → «Config as code»,
# ruta del archivo: /railway.api.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
healthcheckPath = "/api/salud"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

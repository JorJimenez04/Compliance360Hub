# railway.cron.toml — Servicio programado «sync-onedrive» (Monitoreo Transaccional)
#
# Segundo servicio del mismo proyecto de Railway, creado desde este mismo
# repositorio. En Settings → Config-as-code, apuntar a /railway.cron.toml.
# Variables: las mismas DATABASE_URL de la app + TX_ONEDRIVE_* + C360_TAREA=sincronizar_nube.
# Se ejecuta, carga lo nuevo y termina. El horario está en UTC (Colombia = UTC-5).

[build]
builder        = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand      = "/entrypoint.sh"
cronSchedule      = "0 * * * *"      # cada hora, en punto
restartPolicyType = "NEVER"
